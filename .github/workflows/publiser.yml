# Bygger kurssidene fra assets/kurs.json og publiserer hele nettstedet
# til GitHub Pages ved hver push til main (også når kurs.json redigeres
# direkte på GitHub). Ved flytting til Cloudflare gjør Cloudflare samme
# jobb med byggkommandoen «python3 tools/bygg.py».
name: Bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:
  # kursene bor i FrontCore: bygg kurssidene på nytt hver time, så nye kurs får egen side
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bygg kurssidene
        run: python3 tools/bygg.py
        env:
          NETTSTED_URL: https://monscorps.github.io/kkurs.no
          # settes under Settings → Secrets and variables → Actions → Variables når kkurs-api er publisert
          KURS_API_URL: ${{ vars.KURS_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - id: publisering
        uses: actions/deploy-pages@v5
